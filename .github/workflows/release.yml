name: Build & Auto-Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure Gradle Wrapper Distribution (with retry & mirror fallback)
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Verifying Gradle distribution (attempt $attempt)..."
            if ./gradlew --version --no-daemon; then
              break
            fi
            echo "Gradle wrapper download failed on attempt $attempt, retrying in 5s..."
            rm -rf ~/.gradle/wrapper/dists/*/*.part ~/.gradle/wrapper/dists/*/*.lck || true
            if [ "$attempt" -ge 3 ]; then
              sed -i 's|https://services.gradle.org/distributions/|https\\://downloads.gradle-dn.com/distributions/|g' gradle/wrapper/gradle-wrapper.properties
            fi
            sleep 5
          done

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        id: prep_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -type f \( -name "*.apk" -o -name "*.ApK" \) | head -n 1)
          cp "$APK_PATH" app/build/outputs/apk/debug/LyricsFlow-Android.apk
          echo "apk_path=app/build/outputs/apk/debug/LyricsFlow-Android.apk" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=LyricsFlow Android (${GITHUB_REF_NAME})" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release_name=LyricsFlow Android (Build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricsFlow-Android-APK
          path: ${{ steps.prep_apk.outputs.apk_path }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_apk.outputs.tag_name }}
          name: ${{ steps.prep_apk.outputs.release_name }}
          files: ${{ steps.prep_apk.outputs.apk_path }}
          generate_release_notes: true
          make_latest: true
